<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semana de Preparación del estado 2796</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #4A231C; /* Terracota Profundo */
      color: #FDF9F2;            /* Vainilla */
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    /* Tarjeta principal */
    .card-modal {
      background-color: #5C2E24; /* Terracota más claro */
      border: 1px solid #753b2f;
      box-shadow: 0 20px 45px -10px rgba(25, 10, 8, 0.7);
    }

    /* Barra superior de acento */
    .top-gradient-bar {
      height: 4px;
      background: linear-gradient(90deg, #D86A51 0%, #f09580 60%, transparent 100%);
    }

    /* Cajas de inputs y selects */
    .input-box {
      background-color: #3d1b15;
      border: 1px solid #6b352b;
      color: #FDF9F2;
    }
    .input-box:focus {
      outline: none;
      border-color: #D86A51;
      box-shadow: 0 0 0 2px rgba(216, 106, 81, 0.35);
    }

    /* Botones de alianzas */
    .badge-btn {
      background-color: #451f18;
      color: #e5d7cc;
      border: 1px solid #633227;
      transition: all 0.2s ease;
    }
    .badge-btn:hover {
      background-color: #D86A51;
      color: #FDF9F2;
      border-color: #D86A51;
    }
    .badge-selected {
      background-color: #D86A51 !important;
      color: #FDF9F2 !important;
      font-weight: 700;
      border-color: #FDF9F2 !important;
    }

    /* Botón de envío */
    .btn-action {
      background-color: #D86A51;
      color: #FDF9F2;
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    .btn-action:hover {
      background-color: #FDF9F2;
      color: #4A231C;
    }

    /* Cajas contenedoras de iconos */
    .icon-box {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background-color: #411d16;
      border: 1px solid #663328;
    }

    /* Opciones deshabilitadas en selects */
    option {
      background-color: #3d1b15;
      color: #FDF9F2;
    }
    option:disabled {
      color: #9d7b73;
      background-color: #2b130e;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-3 sm:p-6">

  <div class="card-modal w-full max-w-3xl rounded-2xl overflow-hidden relative">
    <div class="top-gradient-bar"></div>

    <!-- Barra de 9 Idiomas -->
    <div class="flex justify-between items-center px-6 pt-5 pb-2">
      <div class="flex items-center gap-1 bg-[#3d1b15] p-1.5 rounded-lg border border-[#6b352b] flex-wrap">
        <button type="button" onclick="setLanguage('es')" id="lang-es" class="px-2 py-1 text-xs rounded font-bold transition bg-[#D86A51] text-[#FDF9F2]">🇪🇸 ES</button>
        <button type="button" onclick="setLanguage('en')" id="lang-en" class="px-2 py-1 text-xs rounded font-bold transition text-[#d5beba] hover:text-white">🇬🇧 EN</button>
        <button type="button" onclick="setLanguage('fr')" id="lang-fr" class="px-2 py-1 text-xs rounded font-bold transition text-[#d5beba] hover:text-white">🇫🇷 FR</button>
        <button type="button" onclick="setLanguage('de')" id="lang-de" class="px-2 py-1 text-xs rounded font-bold transition text-[#d5beba] hover:text-white">🇩🇪 DE</button>
        <button type="button" onclick="setLanguage('ru')" id="lang-ru" class="px-2 py-1 text-xs rounded font-bold transition text-[#d5beba] hover:text-white">🇷🇺 RU</button>
        <button type="button" onclick="setLanguage('ko')" id="lang-ko" class="px-2 py-1 text-xs rounded font-bold transition text-[#d5beba] hover:text-white">🇰🇷 KO</button>
        <button type="button" onclick="setLanguage('pl')" id="lang-pl" class="px-2 py-1 text-xs rounded font-bold transition text-[#d5beba] hover:text-white">🇵🇱 PL</button>
        <button type="button" onclick="setLanguage('id')" id="lang-id" class="px-2 py-1 text-xs rounded font-bold transition text-[#d5beba] hover:text-white">🇮🇩 ID</button>
        <button type="button" onclick="setLanguage('el')" id="lang-el" class="px-2 py-1 text-xs rounded font-bold transition text-[#d5beba] hover:text-white">🇬🇷 EL</button>
      </div>
      <div class="w-7 h-7 rounded-full bg-[#3d1b15] flex items-center justify-center text-[#d5beba] text-xs">✕</div>
    </div>

    <!-- Pantalla de Convocatoria Cerrada -->
    <div id="closedNotice" class="p-10 text-center hidden">
      <div class="text-5xl mb-4">🔒</div>
      <h2 id="t-closedTitle" class="text-xl font-bold text-[#FDF9F2] mb-2">Convocatoria Cerrada</h2>
      <p id="t-closedDesc" class="text-[#e2ceca] text-sm max-w-md mx-auto">El plazo de inscripción ha finalizado o aún no se encuentra abierto. Las asignaciones de horarios se publicarán pronto.</p>
    </div>

    <!-- Contenido del Formulario -->
    <div id="formContainer" class="px-6 pb-6 pt-2">
      <h1 id="t-title" class="text-xl sm:text-2xl font-bold text-center mb-5 text-[#FDF9F2] tracking-wide">Semana de Preparación del estado 2796</h1>

      <form id="savingsForm" class="space-y-5">
        
        <!-- Nombre Jugador / ID -->
        <div>
          <label id="t-playerName" class="block text-[11px] uppercase tracking-wider text-[#e6d0cc] font-semibold mb-1.5">Nombre del Jugador o ID</label>
          <input type="text" id="jugador" required placeholder="Tu Nick exacto o ID" class="w-full input-box rounded-xl px-4 py-2.5 text-sm transition">
        </div>

        <!-- Alianzas -->
        <div>
          <div class="flex flex-wrap justify-center gap-2" id="allianceContainer">
            <button type="button" class="alliance-btn badge-btn text-xs px-3 py-1.5 rounded-full" data-val="LFO">LFO</button>
            <button type="button" class="alliance-btn badge-btn text-xs px-3 py-1.5 rounded-full" data-val="BLO">BLO</button>
            <button type="button" class="alliance-btn badge-btn text-xs px-3 py-1.5 rounded-full" data-val="KOR">KOR</button>
            <button type="button" class="alliance-btn badge-btn text-xs px-3 py-1.5 rounded-full" data-val="POL">POL</button>
            <button type="button" class="alliance-btn badge-btn text-xs px-3 py-1.5 rounded-full" data-val="NEX">NEX</button>
            <button type="button" class="alliance-btn badge-btn text-xs px-3 py-1.5 rounded-full" data-val="PXR">PXR</button>
            <button type="button" class="alliance-btn badge-btn text-xs px-3 py-1.5 rounded-full" data-val="THE">The</button>
          </div>
        </div>

        <!-- Recursos por Intervalos -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-2">
          <div>
            <label id="t-fireCrystal" class="block text-[10px] tracking-wider text-[#e6d0cc] font-bold mb-1.5 uppercase text-center">Cristal de Fuego</label>
            <div class="flex items-center gap-2">
              <div class="icon-box">
                <img src="img/cristal.png" alt="Cristal" onerror="this.outerHTML='<span>🔥</span>'" class="w-7 h-7 object-contain">
              </div>
              <select id="cristalFuego" class="w-full input-box rounded-xl px-3 py-2 text-xs"></select>
            </div>
          </div>

          <div>
            <label id="t-refined" class="block text-[10px] tracking-wider text-[#e6d0cc] font-bold mb-1.5 uppercase text-center">Cristal de Fuego Refinado</label>
            <div class="flex items-center gap-2">
              <div class="icon-box">
                <img src="img/refinado.png" alt="Refinado" onerror="this.outerHTML='<span>💎</span>'" class="w-7 h-7 object-contain">
              </div>
              <select id="refinado" class="w-full input-box rounded-xl px-3 py-2 text-xs"></select>
            </div>
          </div>

          <div>
            <label id="t-fragments" class="block text-[10px] tracking-wider text-[#e6d0cc] font-bold mb-1.5 uppercase text-center">Fragmentos</label>
            <div class="flex items-center gap-2">
              <div class="icon-box">
                <img src="img/fragmentos.png" alt="Fragmentos" onerror="this.outerHTML='<span>🔺</span>'" class="w-7 h-7 object-contain">
              </div>
              <select id="fragmentos" class="w-full input-box rounded-xl px-3 py-2 text-xs"></select>
            </div>
          </div>
        </div>

        <!-- Aceleradores por Intervalos (Días) -->
        <div class="pt-2">
          <p id="t-speedupsHeader" class="text-[11px] font-bold text-center tracking-wider text-[#e6d0cc] uppercase mb-3">Aceleradores (Días)</p>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label id="t-general" class="block text-[10px] uppercase text-[#e6d0cc] font-semibold mb-1">General</label>
              <div class="flex items-center gap-2">
                <div class="icon-box">
                  <img src="img/acel_general.png" alt="General" onerror="this.outerHTML='<span>⏩</span>'" class="w-7 h-7 object-contain">
                </div>
                <select id="acelGeneral" class="w-full input-box rounded-xl px-3 py-2 text-xs"></select>
              </div>
            </div>

            <div>
              <label id="t-training" class="block text-[10px] uppercase text-[#e6d0cc] font-semibold mb-1">Entrenamiento</label>
              <div class="flex items-center gap-2">
                <div class="icon-box">
                  <img src="img/acel_entrenamiento.png" alt="Entrenamiento" onerror="this.outerHTML='<span>⚔️</span>'" class="w-7 h-7 object-contain">
                </div>
                <select id="acelEntrenamiento" class="w-full input-box rounded-xl px-3 py-2 text-xs"></select>
              </div>
            </div>

            <div>
              <label id="t-construction" class="block text-[10px] uppercase text-[#e6d0cc] font-semibold mb-1">Construcción</label>
              <div class="flex items-center gap-2">
                <div class="icon-box">
                  <img src="img/acel_construccion.png" alt="Construcción" onerror="this.outerHTML='<span>🔨</span>'" class="w-7 h-7 object-contain">
                </div>
                <select id="acelConstruccion" class="w-full input-box rounded-xl px-3 py-2 text-xs"></select>
              </div>
            </div>

            <div>
              <label id="t-research" class="block text-[10px] uppercase text-[#e6d0cc] font-semibold mb-1">Investigación</label>
              <div class="flex items-center gap-2">
                <div class="icon-box">
                  <img src="img/acel_investigacion.png" alt="Investigación" onerror="this.outerHTML='<span>🔬</span>'" class="w-7 h-7 object-contain">
                </div>
                <select id="acelInvestigacion" class="w-full input-box rounded-xl px-3 py-2 text-xs"></select>
              </div>
            </div>
          </div>
        </div>

        <!-- 3 Prioridades por Día -->
        <div class="pt-2 border-t border-[#753b2f]">
          <p id="t-scheduleHeader" class="text-[11px] font-bold text-center tracking-wider text-[#e6d0cc] uppercase mb-2">Inscripción por Prioridades (3 opciones por día)</p>
          
          <div class="flex items-center justify-center gap-2 mb-4">
            <input type="checkbox" id="syncSchedule" class="rounded accent-[#D86A51] w-4 h-4 cursor-pointer">
            <label for="syncSchedule" id="t-syncLabel" class="text-xs text-[#f5bfb5] font-medium cursor-pointer">Aplicar las 3 opciones del Lunes a todos los días</label>
          </div>

          <!-- Lunes -->
          <div class="mb-4 bg-[#411d16] p-3 rounded-xl border border-[#6b352b]">
            <label id="t-mon" class="block text-xs uppercase text-[#f5bfb5] font-bold mb-2">Lunes (Construcción)</label>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
              <select id="lunesP1" class="input-box rounded-lg p-2 text-xs"></select>
              <select id="lunesP2" class="input-box rounded-lg p-2 text-xs"></select>
              <select id="lunesP3" class="input-box rounded-lg p-2 text-xs"></select>
            </div>
          </div>

          <!-- Martes -->
          <div class="mb-4 bg-[#411d16] p-3 rounded-xl border border-[#6b352b]">
            <label id="t-tue" class="block text-xs uppercase text-[#f5bfb5] font-bold mb-2">Martes (Investigación)</label>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
              <select id="martesP1" class="input-box rounded-lg p-2 text-xs"></select>
              <select id="martesP2" class="input-box rounded-lg p-2 text-xs"></select>
              <select id="martesP3" class="input-box rounded-lg p-2 text-xs"></select>
            </div>
          </div>

          <!-- Jueves -->
          <div class="bg-[#411d16] p-3 rounded-xl border border-[#6b352b]">
            <label id="t-thu" class="block text-xs uppercase text-[#f5bfb5] font-bold mb-2">Jueves (Entrenamiento)</label>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
              <select id="juevesP1" class="input-box rounded-lg p-2 text-xs"></select>
              <select id="juevesP2" class="input-box rounded-lg p-2 text-xs"></select>
              <select id="juevesP3" class="input-box rounded-lg p-2 text-xs"></select>
            </div>
          </div>
        </div>

        <button type="submit" id="submitBtn" class="btn-action w-full py-3.5 mt-4 rounded-xl font-bold shadow-md cursor-pointer">
          Reserva tu hueco
        </button>

        <p id="msgStatus" class="text-center text-xs font-semibold hidden"></p>
      </form>
    </div>
  </div>

        scheduleHeader: "Pendaftaran Berdasarkan Prioritas (3 pilihan/hari)", syncLabel: "Terapkan 3 pilihan Senin ke semua hari",
        mon: "Senin (Konstruksi)", tue: "Selasa (Riset)", thu: "Kamis (Pelatihan)",
        submit: "Pesan Jadwal", sending: "Mengirim...", success: "Pendaftaran berhasil dikirim!",
        error: "Gagal mengirim data.", alertAlliance: "Silakan pilih aliansi.",
        noParticipate: "-- Tidak berpartisipasi --", p1: "Pilihan 1: ", p2: "Pilihan 2: ", p3: "Pilihan 3: ",
        unlimited: "Tak terbatas", dayUnit: "h",
        closedTitle: "Pendaftaran Ditutup", closedDesc: "Batas waktu pendaftaran telah berakhir atau belum dibuka."
      },
      el: {
        title: "Εβδομάδα Προετοιμασίας State 2796", playerName: "Όνομα Παίκτη ή ID", playerPlaceholder: "Το ακριβές Nick ή ID σου",
        fireCrystal: "Κρύσταλλοι Φωτιάς", refined: "Εξευγενισμένοι Κρύσταλλοι", fragments: "Θραύσματα Κρυστάλλων",
        speedupsHeader: "Επιταχύνσεις (Ημέρες)", general: "Γενικές", training: "Εκπαίδευση",
        construction: "Κατασκευή", research: "Έρευνα",
        scheduleHeader: "Εγγραφή βάσει προτεραιότητας (3 επιλογές/ημέρα)", syncLabel: "Εφαρμογή των 3 επιλογών Δευτέρας σε όλες τις ημέρες",
        mon: "Δευτέρα (Κατασκευή)", tue: "Τρίτη (Έρευνα)", thu: "Πέμπτη (Εκπαίδευση)",
        submit: "Κράτηση θέσης", sending: "Αποστολή...", success: "Η κράτηση στάλθηκε με επιτυχία!",
        error: "Σφάλμα κατά την αποστολή.", alertAlliance: "Παρακαλώ επιλέξτε συμμαχία.",
        noParticipate: "-- Χωρίς συμμετοχή --", p1: "1η Επιλογή: ", p2: "2η Επιλογή: ", p3: "3η Επιλογή: ",
        unlimited: "Άπειρο", dayUnit: "ημ",
        closedTitle: "Οι εγγραφές έκλεισαν", closedDesc: "Η προθεσμία εγγραφής έχει λήξει ή δεν έχει ανοίξει ακόμα."
      }
    };

    let currentLang = "es";

    function safeSetText(id, text) {
      const el = document.getElementById(id);
      if (el) el.textContent = text;
    }

    function safeSetPlaceholder(id, text) {
      const el = document.getElementById(id);
      if (el) el.placeholder = text;
    }

    function populateResourceSelectors() {
      const t = translations[currentLang] || translations.es;

      const cfRanges = [
        { v: "0-500", l: "0 - 500" }, { v: "501-1000", l: "501 - 1000" },
        { v: "1001-1500", l: "1001 - 1500" }, { v: "1501-2000", l: "1501 - 2000" },
        { v: "2001-2500", l: "2001 - 2500" }, { v: "2501-3000", l: "2501 - 3000" },
        { v: "+3001", l: "+3001" }, { v: "Ilimitado", l: t.unlimited }
      ];

      const refRanges = [
        { v: "0-20", l: "0 - 20" }, { v: "21-50", l: "21 - 50" },
        { v: "51-80", l: "51 - 80" }, { v: "81-110", l: "81 - 110" },
        { v: "111-130", l: "111 - 130" }, { v: "131-160", l: "131 - 160" },
        { v: "+161", l: "+161" }, { v: "Ilimitado", l: t.unlimited }
      ];

      const fragRanges = [
        { v: "0-250", l: "0 - 250" }, { v: "251-500", l: "251 - 500" },
        { v: "501-1000", l: "501 - 1000" }, { v: "1001-1500", l: "1001 - 1500" },
        { v: "1501-2000", l: "1501 - 2000" }, { v: "+2001", l: "+2001" },
        { v: "Ilimitado", l: t.unlimited }
      ];

      const spdRanges = [
        { v: "0-29", l: `0 - 29 ${t.dayUnit}` }, { v: "30-40", l: `30 - 40 ${t.dayUnit}` },
        { v: "41-59", l: `41 - 59 ${t.dayUnit}` }, { v: "+60", l: `+60 ${t.dayUnit}` },
        { v: "+100", l: `+100 ${t.dayUnit}` }, { v: "Ilimitado", l: t.unlimited }
      ];

      fillSelect("cristalFuego", cfRanges);
      fillSelect("refinado", refRanges);
      fillSelect("fragmentos", fragRanges);
      fillSelect("acelGeneral", spdRanges);
      fillSelect("acelEntrenamiento", spdRanges);
      fillSelect("acelConstruccion", spdRanges);
      fillSelect("acelInvestigacion", spdRanges);
    }

    function fillSelect(id, list) {
      const el = document.getElementById(id);
      if (!el) return;
      const prev = el.value;
      el.innerHTML = list.map(item => `<option value="${item.v}">${item.l}</option>`).join('');
      if (prev) el.value = prev;
    }

    function populateTimeSelectors() {
      const t = translations[currentLang] || translations.es;
      const selectors = [
        { id: "lunesP1", label: t.p1 }, { id: "lunesP2", label: t.p2 }, { id: "lunesP3", label: t.p3 },
        { id: "martesP1", label: t.p1 }, { id: "martesP2", label: t.p2 }, { id: "martesP3", label: t.p3 },
        { id: "juevesP1", label: t.p1 }, { id: "juevesP2", label: t.p2 }, { id: "juevesP3", label: t.p3 }
      ];

      selectors.forEach(({ id, label }) => {
        const el = document.getElementById(id);
        if (!el) return;
        const currentVal = el.value || "No participa";
        let html = `<option value="No participa">${t.noParticipate}</option>`;

        for (let h = 0; h < 24; h++) {
          for (let m = 0; m < 60; m += 30) {
            const timeStr = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
            html += `<option value="${timeStr}">${label}${timeStr}</option>`;
          }
        }
        el.innerHTML = html;
        el.value = currentVal;
      });
    }

    function checkConvocatoria() {
      if (!SCRIPT_URL || SCRIPT_URL.includes("...")) return;
      const script = document.createElement("script");
      const cbName = "onCheckStatus_" + Math.floor(Math.random() * 1000000);

      window[cbName] = function(data) {
        if (data && data.estado === "CERRADO") {
          document.getElementById("formContainer").classList.add("hidden");
          document.getElementById("closedNotice").classList.remove("hidden");
        } else {
          document.getElementById("formContainer").classList.remove("hidden");
          document.getElementById("closedNotice").classList.add("hidden");
        }
        delete window[cbName];
        if (script.parentNode) script.parentNode.removeChild(script);
      };

      script.src = SCRIPT_URL + (SCRIPT_URL.includes("?") ? "&" : "?") + "callback=" + cbName + "&t=" + Date.now();
      document.body.appendChild(script);
    }

    function setLanguage(lang) {
      if (!translations[lang]) return;
      currentLang = lang;
      const t = translations[lang];

      safeSetText("t-title", t.title);
      safeSetText("t-playerName", t.playerName);
      safeSetPlaceholder("jugador", t.playerPlaceholder);
      safeSetText("t-fireCrystal", t.fireCrystal);
      safeSetText("t-refined", t.refined);
      safeSetText("t-fragments", t.fragments);
      safeSetText("t-speedupsHeader", t.speedupsHeader);
      safeSetText("t-general", t.general);
      safeSetText("t-training", t.training);
      safeSetText("t-construction", t.construction);
      safeSetText("t-research", t.research);
      safeSetText("t-scheduleHeader", t.scheduleHeader);
      safeSetText("t-syncLabel", t.syncLabel);
      safeSetText("t-mon", t.mon);
      safeSetText("t-tue", t.tue);
      safeSetText("t-thu", t.thu);
      safeSetText("submitBtn", t.submit);
      safeSetText("t-closedTitle", t.closedTitle);
      safeSetText("t-closedDesc", t.closedDesc);

      ["es", "en", "fr", "de", "ru", "ko", "pl", "id", "el"].forEach(l => {
        const btn = document.getElementById(`lang-${l}`);
        if (btn) {
          btn.className = (l === lang) 
            ? "px-2 py-1 text-xs rounded font-bold transition bg-[#D86A51] text-[#FDF9F2]" 
            : "px-2 py-1 text-xs rounded font-bold transition text-[#d5beba] hover:text-white";
        }
      });

      populateResourceSelectors();
      populateTimeSelectors();
    }

    function syncAllDays() {
      const p1 = document.getElementById("lunesP1").value;
      const p2 = document.getElementById("lunesP2").value;
      const p3 = document.getElementById("lunesP3").value;

      ["martes", "jueves"].forEach(dia => {
        document.getElementById(`${dia}P1`).value = p1;
        document.getElementById(`${dia}P2`).value = p2;
        document.getElementById(`${dia}P3`).value = p3;
      });
    }

    ["lunesP1", "lunesP2", "lunesP3"].forEach(id => {
      document.getElementById(id).addEventListener("change", () => {
        if (document.getElementById("syncSchedule").checked) syncAllDays();
      });
    });

    document.getElementById("syncSchedule").addEventListener("change", (e) => {
      if (e.target.checked) syncAllDays();
    });

    let selectedAlliance = "";
    document.querySelectorAll(".alliance-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".alliance-btn").forEach(b => b.classList.remove("badge-selected"));
        btn.classList.add("badge-selected");
        selectedAlliance = btn.getAttribute("data-val");
      });
    });

    document.getElementById("savingsForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const t = translations[currentLang] || translations.es;

      if (!selectedAlliance) {
        alert(t.alertAlliance);
        return;
      }

      const btn = document.getElementById("submitBtn");
      const msg = document.getElementById("msgStatus");

      btn.disabled = true;
      btn.textContent = t.sending;

      const payload = {
        jugador: document.getElementById("jugador").value,
        alianza: selectedAlliance,
        cristalFuego: document.getElementById("cristalFuego").value,
        refinado: document.getElementById("refinado").value,
        fragmentos: document.getElementById("fragmentos").value,
        acelGeneral: document.getElementById("acelGeneral").value,
        acelEntrenamiento: document.getElementById("acelEntrenamiento").value,
        acelConstruccion: document.getElementById("acelConstruccion").value,
        acelInvestigacion: document.getElementById("acelInvestigacion").value,
        horaLunesP1: document.getElementById("lunesP1").value,
        horaLunesP2: document.getElementById("lunesP2").value,
        horaLunesP3: document.getElementById("lunesP3").value,
        horaMartesP1: document.getElementById("martesP1").value,
        horaMartesP2: document.getElementById("martesP2").value,
        horaMartesP3: document.getElementById("martesP3").value,
        horaJuevesP1: document.getElementById("juevesP1").value,
        horaJuevesP2: document.getElementById("juevesP2").value,
        horaJuevesP3: document.getElementById("juevesP3").value
      };

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        msg.textContent = t.success;
        msg.className = "text-center text-xs font-semibold text-emerald-400 block";
        document.getElementById("savingsForm").reset();
        document.querySelectorAll(".badge-selected").forEach(b => b.classList.remove("badge-selected"));
        selectedAlliance = "";
      } catch (err) {
        msg.textContent = t.error;
        msg.className = "text-center text-xs font-semibold text-rose-400 block";
      } finally {
        btn.disabled = false;
        btn.textContent = t.submit;
      }
    });

    populateResourceSelectors();
    populateTimeSelectors();
    checkConvocatoria();
  </script>
</body>
</html>
